<style>
/* Layout: one fixed screen; photo strip pinned to the bottom edge, logo centred above it. Single light look by choice (the cutout has pale edge fringing). */
:root {
  --bg: #e9eaec;
  --ink: #16181c;
  --muted: #6d717a;
  --rule: #c9ccd2;
  --accent: #d6452b;
  --surface: #ffffff;
  --pattern-fill: #dcdee2;   /* name pattern behind everything */
  --pattern-line: #c6c9cf;
  --shadow: 0 6px 18px rgb(22 24 28 / .18), 0 1px 3px rgb(22 24 28 / .12);
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { font: 14px/1.4 system-ui, sans-serif; }
body {
  background: var(--bg); color: var(--ink);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
.stage.dragging { cursor: grabbing; }

/* Artist-name pattern: rows of the centred artist's name behind the logo and photo */
.names {
  position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  display: flex; flex-direction: column; justify-content: center;
}
.names div {
  font-family: var(--display); font-weight: 800; text-transform: uppercase;
  font-size: clamp(56px, 17vw, 120px); line-height: .9; letter-spacing: .005em;
  white-space: nowrap; color: var(--pattern-fill); will-change: transform, opacity;
}
.names div:nth-child(even) { color: transparent; -webkit-text-stroke: 1.5px var(--pattern-line); }

.logo {
  position: absolute; left: 50%; z-index: 0;   /* sits behind the photo */
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  width: min(41vw, 210px); height: auto; aspect-ratio: 428 / 290; transform: translateX(-50%);
  pointer-events: none; overflow: visible;   /* tinted per artist by the #neon-logo filter */
}

/* Speed dial: bottom-right, drops away while swiping, returns with the centred person's links */
.dial {
  --neon: #39ff14;
  position: fixed; z-index: 5; right: 16px;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transition: transform .38s cubic-bezier(.2, .8, .2, 1);
}
.dial.away { transform: translateY(calc(100% + 32px + env(safe-area-inset-bottom, 0px))); }
.fab {
  width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--neon); color: var(--ink);
  box-shadow: var(--shadow), 0 0 22px color-mix(in srgb, var(--neon) 55%, transparent);
  display: grid; place-items: center;
}
.fab svg { width: 26px; height: 26px; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.dial.open .fab svg { transform: rotate(135deg); }
.fab:focus-visible, .act:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.acts {
  position: absolute; right: 6px; bottom: 76px; margin: 0; padding: 0; list-style: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
  pointer-events: none;   /* only the visible buttons catch taps; swipes pass through */
}
.acts li {
  opacity: 0; transform: translateY(14px) scale(.92); pointer-events: none;
  transition: opacity .18s, transform .28s cubic-bezier(.2, .8, .2, 1);
  transition-delay: calc((4 - var(--i)) * 35ms);
}
.dial.open .acts li { opacity: 1; transform: none; pointer-events: auto; transition-delay: calc(var(--i) * 35ms); }
.who {
  font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink); background: var(--neon); border-radius: 999px; padding: 7px 12px;
  margin-right: 4px; box-shadow: var(--shadow);
}
.act { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.chip {
  background: var(--surface); box-shadow: var(--shadow); border-radius: 999px;
  padding: 8px 12px; font: 400 12px/1.2 var(--mono); white-space: nowrap;
  max-width: calc(100vw - 110px); overflow: hidden; text-overflow: ellipsis;
}
.chip b { font-weight: 500; color: var(--muted); margin-right: 6px; }
.ico {
  width: 48px; height: 48px; border-radius: 50%; flex: none;
  background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 2px var(--neon); display: grid; place-items: center;
}
.ico svg { width: 22px; height: 22px; }

.strip {
  position: absolute; left: 0; right: 0; bottom: 0;
  /* top + height set in JS: sized so ~one person fills the width; if the photo is taller
     than the screen, the bottom (hands) runs off-screen rather than cropping heads */
  bottom: auto; overflow: hidden; z-index: 1;
}
.track { position: absolute; top: 0; left: 0; height: 100%; display: flex; will-change: transform; }
/* Black-and-white base: one repeating background = no hairline seams between copies */
/* Perf test: grayscale/blur off — re-enable filter on .gray if swipe feels OK without it */
.gray { position: absolute; inset: 0; background: var(--img) 0 0 / var(--tw) 100% repeat-x; }
/* Colour copy per tile, masked to the centred person's traced shape */
.tile { position: relative; }
.tile svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.hl { opacity: 0; transition: opacity .45s ease; }
.hl.on { opacity: 1; }
.outline { display: none; fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.debug .outline { display: inline; }
.tile { height: 100%; aspect-ratio: 999 / 686; flex: none; }

/* Tuning overlay: press D */
.debug .center { display: block; }
.center {
  display: none; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
  background: var(--accent); pointer-events: none;
}
.debug .tile { outline: 1px dashed var(--accent); outline-offset: -1px; }
.mark { display: none; position: absolute; top: 0; width: 1px; height: 100%; background: color-mix(in srgb, var(--accent) 45%, transparent); }
.mark span { position: absolute; top: 6px; left: 4px; font: 500 10px var(--mono); color: var(--accent); }
.debug .mark { display: block; }
</style>

const N = STEPS.length, TILES = 5, MID = 2;
const stage = document.getElementById("stage");
const strip = document.getElementById("strip");
const track = document.getElementById("track");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- Colour masks from the people SVG ---------------------------------------
const SVGNS = "http://www.w3.org/2000/svg";
const defs = document.querySelector("#defs defs");
const photo = document.createElementNS(SVGNS, "image");
photo.id = "photo"; photo.setAttribute("href", IMG);
photo.setAttribute("width", IMG_W); photo.setAttribute("height", IMG_H);
photo.setAttribute("preserveAspectRatio", "none");
defs.appendChild(photo);

const src = new DOMParser().parseFromString(document.getElementById("people-svg").textContent.trim(), "image/svg+xml");
const layers = [...src.querySelectorAll('[id^="p"]')].filter((el) => /^p\d+$/.test(el.id));  // document order = back to front
function painted(el, color) {
  const c = document.importNode(el, true);
  c.removeAttribute("id");
  [c, ...c.querySelectorAll("*")].forEach((n) => {
    n.removeAttribute("style"); n.removeAttribute("class"); n.removeAttribute("id");
    if (color) { n.setAttribute("fill", color); n.setAttribute("stroke", "none"); }
  });
  return c;
}
const MASKED = new Set();
layers.forEach((el, depth) => {
  const m = document.createElementNS(SVGNS, "mask");
  m.id = "m-" + el.id;
  m.setAttribute("maskUnits", "userSpaceOnUse");
  m.setAttribute("x", 0); m.setAttribute("y", 0); m.setAttribute("width", IMG_W); m.setAttribute("height", IMG_H);
  const g = document.createElementNS(SVGNS, "g");
  /* feather blur disabled for swipe perf test */
  g.appendChild(painted(el, "#fff"));
  layers.slice(depth + 1).forEach((front) => g.appendChild(painted(front, "#000")));  // cut out people in front
  m.appendChild(g); defs.appendChild(m);
  MASKED.add(el.id);
});

// Build tiles (+ debug markers per tile)
track.style.setProperty("--img", `url(${IMG})`);
for (let t = 0; t < TILES; t++) {
  const tile = document.createElement("div");
  tile.className = "tile";
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", `0 0 ${IMG_W} ${IMG_H}`);
  s.setAttribute("preserveAspectRatio", "none");
  STEPS.forEach((_, i) => {
    const id = "p" + (i + 1);
    if (!MASKED.has(id)) return;
    const u = document.createElementNS(SVGNS, "use");
    u.setAttribute("href", "#photo"); u.setAttribute("mask", `url(#m-${id})`);
    u.setAttribute("class", "hl"); u.dataset.i = i;
    s.appendChild(u);
  });
  layers.forEach((el) => { const o = painted(el); o.setAttribute("class", "outline"); s.appendChild(o); });
  tile.appendChild(s);
  STEPS.forEach((s, i) => {
    const m = document.createElement("div");
    m.className = "mark";
    m.style.left = (s.x / IMG_W * 100) + "%";
    m.innerHTML = `<span>${i + 1}</span>`;
    tile.appendChild(m);
  });
  track.appendChild(tile);
}
const hlUses = track.querySelectorAll(".hl");

// World coordinates: an endless row of images, each IMG_W wide. x = world x at screen centre.
// Global step n -> world position floor(n/N)*IMG_W + STEPS[n mod N].x
const mod = (a, b) => ((a % b) + b) % b;
const stepPos = (n) => Math.floor(n / N) * IMG_W + STEPS[mod(n, N)].x;
function nearestStep(x) {
  let best = 0, bd = Infinity;
  const k = Math.floor(x / IMG_W);
  for (let n = (k - 1) * N; n < (k + 2) * N; n++) {
    const d = Math.abs(stepPos(n) - x);
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}

let lit = -1, litStep = 0, nameLit = -1;
let x = STEPS[0].x, v = 0, target = x, scale = 1, animating = false, springRaf = 0;
let renderRaf = 0;

function measure() {
  const vw = innerWidth, vh = innerHeight;
  scale = Math.min(vw / VIEW_W, vh * 1.15 / IMG_H);   // cap stops desktop/landscape getting huge
  const h = IMG_H * scale;
  strip.style.height = h + "px";
  strip.style.top = (Math.max(vh - h, TOP_MIN) + vh * DROP) + "px";
  track.style.setProperty("--tw", IMG_W * scale + "px");
  render();
}
function nameDirTo(to, from) {
  if (from < 0) return 1;
  let d = to - from;
  if (d > N / 2) d -= N;
  if (d < -N / 2) d += N;
  return Math.sign(d) || 1;
}
function syncNamePattern(i, dir) {
  if (i === nameLit) return;
  if (nameLit === -1) fillNames(i);
  else swapNames(i, dir ?? nameDirTo(i, nameLit));
  nameLit = i;
}
function render() {
  const k = Math.floor(x / IMG_W);
  const within = x - k * IMG_W;           // 0..IMG_W inside tile k
  const tx = innerWidth / 2 - (MID * IMG_W + within) * scale;
  track.style.transform = `translate3d(${tx}px,0,0)`;
  const a = mod(nearestStep(x), N);
  if (a !== lit) {
    const g = nearestStep(x), dir = Math.sign(g - litStep) || 1;
    litStep = g;
    lit = a;
    hlUses.forEach((u) => u.classList.toggle("on", +u.dataset.i === a));
    if (!drag && !animating) syncNamePattern(a, dir);
  }
}
function scheduleRender() {
  if (renderRaf) return;
  renderRaf = requestAnimationFrame(() => { renderRaf = 0; render(); });
}

// Critically damped spring toward target
let last = 0;
function stopSpring() {
  animating = false;
  cancelAnimationFrame(springRaf);
  springRaf = 0;
}
function tick(t) {
  if (!animating) return;
  const dt = Math.min(0.032, (t - last) / 1000 || 0.016); last = t;
  const w = 16, k = w * w, c = 2 * w;
  v += (-k * (x - target) - c * v) * dt;
  x += v * dt;
  if (Math.abs(x - target) < 0.05 && Math.abs(v) < 1) {
    x = target; v = 0; stopSpring();
    render();
    const settled = mod(nearestStep(x), N);
    syncNamePattern(settled, nameDirTo(settled, nameLit));
    dialBack();
    return;
  }
  render();
  springRaf = requestAnimationFrame(tick);
}
function animateTo(tx) {
  target = tx;
  if (reduceMotion) {
    x = tx; v = 0; stopSpring();
    render();
    const settled = mod(nearestStep(x), N);
    syncNamePattern(settled, nameDirTo(settled, nameLit));
    dialBack();
    return;
  }
  if (!animating) { animating = true; last = performance.now(); springRaf = requestAnimationFrame(tick); }
}
function goToStep(n) { if (mod(n, N) !== dialIdx) dialAway(); animateTo(stepPos(n)); }
function goToIndex(i) {
  // shortest way round the loop to index i
  const cur = nearestStep(x), ci = mod(cur, N);
  let d = i - ci; if (d > N / 2) d -= N; if (d < -N / 2) d += N;
  goToStep(cur + d);
}

// Drag / swipe
let drag = null;
stage.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  stage.setPointerCapture(e.pointerId);
  stopSpring();
  target = x;
  v = 0;
  drag = { id: e.pointerId, sx: e.clientX, x0: x, startStep: nearestStep(x), samples: [[e.timeStamp, e.clientX]] };
  stage.classList.add("dragging");
  setOpen(false);
});
stage.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  x = drag.x0 - (e.clientX - drag.sx) / scale;
  if (Math.abs(e.clientX - drag.sx) > 8) dialAway();
  drag.samples.push([e.timeStamp, e.clientX]);
  if (drag.samples.length > 6) drag.samples.shift();
  scheduleRender();
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const s = drag.samples, a = s[0], b = s[s.length - 1];
  const dtS = Math.max(0.016, (b[0] - a[0]) / 1000);
  const recent = e.timeStamp - b[0] < 100;
  const screenV = recent ? (b[1] - a[1]) / dtS : 0;    // px/s on screen
  const worldV = -screenV / scale;
  const moved = e.clientX - drag.sx;
  // Swipe sensitivity: one person per swipe, max. Advance only on a deliberate swipe:
  // a drag past SWIPE_DIST of the screen, or a fast flick that also travelled SWIPE_MIN px.
  const SWIPE_DIST = 0.3, SWIPE_SPEED = 800, SWIPE_MIN = 50;
  let n = drag.startStep;
  if (Math.abs(moved) > innerWidth * SWIPE_DIST ||
      (Math.abs(screenV) > SWIPE_SPEED && Math.abs(moved) > SWIPE_MIN && Math.sign(screenV) === Math.sign(moved))) {
    n += moved < 0 ? 1 : -1;
  }
  v = worldV * 0.5;   // carry some flick momentum into the snap
  drag = null;
  stage.classList.remove("dragging");
  if (renderRaf) { cancelAnimationFrame(renderRaf); renderRaf = 0; }
  goToStep(n);
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

// Desktop testing: arrows + horizontal wheel
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") goToStep(nearestStep(target) + 1);
  if (e.key === "ArrowLeft") goToStep(nearestStep(target) - 1);
  if (e.key === "Escape") setOpen(false);
  if (e.key.toLowerCase() === "d") document.body.classList.toggle("debug");
});
let wheelLock = 0;
stage.addEventListener("wheel", (e) => {
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  e.preventDefault();
  if (Math.abs(d) < 8 || e.timeStamp < wheelLock) return;
  wheelLock = e.timeStamp + 380;
  goToStep(nearestStep(target) + (d > 0 ? 1 : -1));
}, { passive: false });


// ---- Speed dial ----------------------------------------------------------
const dial = document.getElementById("dial"), acts = document.getElementById("acts"), fab = document.getElementById("fab");
const ICONS = {
  ig: '<rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6 10 4h4l1.5 2"/>',
  email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  call: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  text: '<path d="M4 5h16v11H10l-6 4z"/>',
};
const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fillDial(i) {
  const p = STEPS[i], digits = p.phone.replace(/[^\d+]/g, ""), sms = (p.sms || p.phone).replace(/[^\d+]/g, "");
  const rows = [
    ["ig", "Instagram", "@" + p.ig, `https://instagram.com/${encodeURIComponent(p.ig)}`],
    ["email", "Email", p.email, `mailto:${p.email}`],
    ["call", "Call", p.phone, `tel:${digits}`],
    ["text", "Text", p.sms || p.phone, `sms:${sms}`],
  ];
  acts.innerHTML = `<li class="who" style="--i:4">${esc(p.name)}</li>` + rows.map(([k, label, val, href], j) =>
    `<li style="--i:${3 - j}"><a class="act" href="${esc(href)}"${k === "ig" ? ' target="_blank" rel="noopener"' : ""} aria-label="${label} ${esc(p.name)}: ${esc(val)}">` +
    `<span class="chip"><b>${label}</b>${esc(val)}</span><span class="ico">${svg(ICONS[k])}</span></a></li>`).join("");
  fab.setAttribute("aria-label", `Contact ${p.name}`);
}
function setOpen(open) { dial.classList.toggle("open", open); fab.setAttribute("aria-expanded", open); }
fab.addEventListener("click", () => setOpen(!dial.classList.contains("open")));

let dialIdx = 0, awayAt = 0, backTimer = 0;
function dialAway() {
  clearTimeout(backTimer);
  if (dial.classList.contains("away")) return;
  setOpen(false); dial.classList.add("away"); awayAt = performance.now();
}
function dialBack() {
  if (!dial.classList.contains("away")) return;
  clearTimeout(backTimer);
  const wait = Math.max(0, 380 - (performance.now() - awayAt));   // let it finish dropping before swapping
  backTimer = setTimeout(() => {
    const i = mod(nearestStep(x), N);
    if (i !== dialIdx) { dialIdx = i; fillDial(i); }
    dial.classList.remove("away");
  }, wait);
}
fillDial(0);

// ---- Name pattern ----------------------------------------------------------
const namesEl = document.getElementById("names");
let nameRows = [], nameAnims = [], nameToken = 0;
function buildRows() {
  const probe = document.createElement("div"); probe.textContent = "X"; namesEl.appendChild(probe);
  const rowH = probe.getBoundingClientRect().height || 80; probe.remove();
  const count = Math.ceil(innerHeight / rowH) + 1;
  namesEl.innerHTML = "";
  nameRows = Array.from({ length: count }, (_, i) => {
    const r = document.createElement("div");
    r.style.marginLeft = -((i * 137) % 260) + "px";   // brick offset so rows don't line up
    namesEl.appendChild(r); return r;
  });
}
function resetNameRowStyles() {
  nameRows.forEach((r) => { r.style.transform = ""; r.style.opacity = ""; });
}
function cancelNameAnims() {
  nameAnims.forEach((a) => { try { a.cancel(); } catch (_) {} });
  nameAnims = [];
  resetNameRowStyles();
}
function whenAnimsDone(anims, timeoutMs, cb) {
  if (!anims.length) { cb(); return; }
  let left = anims.length, settled = false;
  const done = () => {
    if (settled) return;
    if (--left > 0) return;
    settled = true;
    clearTimeout(tid);
    cb();
  };
  const tid = setTimeout(done, timeoutMs);
  anims.forEach((a) => { a.onfinish = done; });
}
function fillNames(i) {
  cancelNameAnims();
  const txt = (STEPS[i].name + " \u00b7 ").repeat(8);
  nameRows.forEach((r) => (r.textContent = txt));
}
// Quick out (in swipe direction), swap, quick in. Odd rows travel the other way for texture.
function swapNames(i, dir) {
  const token = ++nameToken;
  cancelNameAnims();
  if (reduceMotion) { fillNames(i); return; }
  const D = 70;
  const rowCount = nameRows.length;
  const outMs = 150 + Math.max(0, rowCount - 1) * 14 + 40;
  const out = nameRows.map((r, k) => {
    const s = (k % 2 ? 1 : -1) * dir;
    return r.animate([{ transform: "none", opacity: 1 }, { transform: `translateX(${s * D}px)`, opacity: 0 }],
      { duration: 150, delay: k * 14, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards" });
  });
  nameAnims = out;
  whenAnimsDone(out, outMs, () => {
    if (token !== nameToken) return;
    fillNames(i);
    const inMs = 260 + Math.max(0, rowCount - 1) * 18 + 40;
    nameAnims = nameRows.map((r, k) => {
      const s = (k % 2 ? 1 : -1) * dir;
      return r.animate([{ transform: `translateX(${-s * D}px)`, opacity: 0 }, { transform: "none", opacity: 1 }],
        { duration: 260, delay: k * 18, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" });
    });
    whenAnimsDone(nameAnims, inMs, () => {
      if (token !== nameToken) return;
      resetNameRowStyles();
    });
  });
}
buildRows();
fillNames(0);
nameLit = 0;
addEventListener("resize", () => {
  buildRows();
  const i = Math.max(nameLit, 0);
  nameLit = -1;
  fillNames(i);
  nameLit = i;
});

addEventListener("resize", measure);

measure();
</script>

</body>
